[project]
name = "Nexora"
version = "3.0.0"
description = "Real-time PPE compliance monitoring platform for Construction & Medical sectors"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: heavy real-inference tests on the bundled weights (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib.*",
]
