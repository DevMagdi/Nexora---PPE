[project]
name = "Nexora"
version = "4.0.0"
description = "Industrial PPE monitoring for factories, construction sites, workshops and warehouses"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: deployment tests requiring the separately provisioned approved checkpoint",
]
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib.*",
]
