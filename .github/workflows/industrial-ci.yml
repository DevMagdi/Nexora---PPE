name: Industrial quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industrial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts and pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements/*.txt"
      - run: python -m pip install -r requirements/test.txt
      - run: ruff check app migrations scripts tests
      - run: ruff format --check app migrations scripts tests
      - run: python -m compileall -q app migrations scripts
      - run: pytest -q --cov=app --cov-fail-under=75 --cov-report=term-missing --cov-report=xml:test-results/coverage.xml --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/*.xml
          if-no-files-found: ignore

  frontend:
    name: Console desktop and mobile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
