# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite+aiosqlite:///./ppe_detection.db
      CONSTRUCTION_MODEL_PATH: Model/ppe.pt
      MEDICAL_MODEL_PATH: Model/bestMedicalModel.pt
      HYBRID_DETECTION_ENABLED: "true"
    volumes:
      - ./app:/app/app
      - ./Model:/app/Model
    # Webcam passthrough (Linux only)
    # devices:
    #   - /dev/video0:/dev/video0

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
