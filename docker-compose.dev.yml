# Local development only. This stack is independent of the locked-down on-prem production compose.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      ALLOWED_VIDEO_DIR: /app/videos
      UPLOADS_DIR: /app/videos/uploads
      ALLOWED_RTSP_PREFIXES: ${ALLOWED_RTSP_PREFIXES:-}
      DATABASE_URL: sqlite+aiosqlite:///./ppe_detection.db
      PPE_MODEL_PATH: /app/Model/ppe.pt
      DETECTION_CONFIDENCE: "0.50"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - type: bind
        source: ./Model/ppe.pt
        target: /app/Model/ppe.pt
        read_only: true
        bind:
          create_host_path: false
      - dev_videos:/app/videos
      - ./violation_frames:/app/violation_frames
    security_opt:
      - no-new-privileges:true

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

volumes:
  dev_videos:
