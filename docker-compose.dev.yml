# Local development only. This stack is independent of the locked-down on-prem production compose.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite+aiosqlite:///./ppe_detection.db
      CONSTRUCTION_MODEL_PATH: Model/ppe.pt
      MEDICAL_MODEL_PATH: Model/bestMedicalModel_FINAL.pt
      HYBRID_DETECTION_ENABLED: "true"
    volumes:
      - ./app:/app/app
      - ./Model:/app/Model
      - ./violation_frames:/app/violation_frames
    security_opt:
      - no-new-privileges:true

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
